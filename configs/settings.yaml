target_symbols:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - NVDA
  - META
  - TSLA
  - JPM
  - V
  - JNJ

data_collection:
  stock_price:
    period: "1y"
    interval: "1d"
  news:
    lookback_days: 365
    max_articles_per_symbol: 500

sentiment:
  model_name: "ProsusAI/finbert"
  batch_size: 32
  device: "cuda"
  max_length: 512

analysis:
  granger_max_lag: 10
  significance_level: 0.05
  correlation_min_threshold: 0.15

api:
  finnhub:
    calls_per_minute: 55
    news_category: "company"
  newsapi:
    requests_per_day: 95

backtest:
  initial_capital: 100000
  commission_per_share: 0.005
  slippage_pct: 0.0005
  risk_free_rate: 0.045
  max_position_risk: 0.02
  atr_stop_multiplier: 2.0
  atr_profit_multiplier: 3.0
  max_concurrent_positions: 3
  daily_loss_limit: 0.05
  tier_a_symbols:
    - GOOGL
    - TSLA
    - AAPL

strategy:
  threshold:
    buy_threshold: 0.1
    sell_threshold: -0.1
  combo:
    sentiment_buy: 0.05
    sentiment_sell: -0.05
    rsi_buy: 45
    rsi_sell: 55
  mean_reversion:
    extreme_positive: 0.3
    extreme_negative: -0.3
  adaptive:
    lookback_days: 20
    sigma_multiplier: 1.0
  ensemble:
    sentiment_weight: 0.6
    technical_weight: 0.4

pead:
  target_universe: "sp500"
  min_market_cap_billion: 10
  lookback_quarters: 8
  holding_periods:
    - 5
    - 10
    - 20
    - 40
    - 60
  entry_delay_days: 1
  surprise_threshold_pct: 3.0
  volume_spike_multiplier: 0.0
  max_positions: 10
  position_size_pct: 0.05
  stop_loss_pct: 0.05
  backtest:
    initial_capital: 100000
    commission_per_share: 0.005
    slippage_pct: 0.0005
    start_year: 2022
    end_year: 2025
